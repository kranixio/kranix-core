core:
  reconcile_interval: 15s
  max_concurrent_reconciles: 10

state:
  backend: memory          # memory | postgres | etcd
  postgres_dsn: ""
  etcd_endpoints: []       # e.g., ["localhost:2379"]

policy:
  default_cpu_limit: "500m"
  default_memory_limit: "512Mi"
  enforce_namespace_isolation: true

eventbus:
  buffer_size: 1024

drift_detection:
  enabled: true
  check_interval: 30s

event_sourcing:
  enabled: true
  storage_backend: memory  # memory | postgres | etcd
  max_event_age: 720h      # 30 days
  compression: false

health_gate:
  enabled: true
  default_timeout: 5m
  check_interval: 30s

autoscaler:
  check_interval: 30s
  metrics_provider: "prometheus"  # prometheus, custom

scheduler:
  cost_provider: "aws"           # aws, gcp, azure, custom
  node_registry: "kubernetes"    # kubernetes, custom

dependency:
  enabled: true
  max_depth: 10

prediction:
  model_type: "simple"          # simple, ml, custom
  check_interval: 60s

multitenancy:
  enabled: true
  default_isolation: true

# Hard aggregate limits per kubernetes namespace OR team (label kranix.io/team or tenant id).
rollback_history:
  enabled: true
  max_versions: 10

workload_tags:
  require_team: false
  require_environment: false
  require_cost_center: false

resource_quota:
  hard_limits:
    # - namespace: team-a-ns
    #   max_cpu_requests: "8"
    #   max_memory_requests: 16Gi
    #   max_workloads: 50
    #   max_replicas_total: 200
    # - team_id: platform
    #   max_workloads: 100